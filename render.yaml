services:
  - type: web
    name: anshika-merchant-bot
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /v1/healthz
    envVars:
      - key: LLM_PROVIDER
        value: groq
      - key: LLM_MODEL
        value: openai/gpt-oss-20b
      - key: LLM_FALLBACK_MODEL
        value: openai/gpt-oss-120b
      - key: LLM_SEED
        value: "20260426"
      - key: LLM_TIMEOUT_SECONDS
        value: "8"
      - key: LLM_API_KEY
        sync: false
      - key: BOT_TEAM_NAME
        value: Anshika Vera Merchant Engine
      - key: BOT_TEAM_MEMBERS
        value: Anshika K
      - key: BOT_MODEL
        value: openai/gpt-oss-20b
      - key: BOT_APPROACH
        value: Hybrid Groq composer with deterministic templates, playbooks, and hydration fallbacks
      - key: BOT_CONTACT_EMAIL
        value: YOUR_EMAIL@gmail.com
      - key: BOT_VERSION
        value: "1.0.0"
